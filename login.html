<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AI Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-cpu-fill text-primary fs-4"></i>
        <span class="fw-bold">AI <span class="text-primary">Hub</span></span>
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="calendario.html">Calendário</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="pt-navbar pb-5" style="background-color: #090e18; min-height: 100vh;">
    <div class="container">
      <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-4">
          <div class="card bg-dark-card border-primary text-white p-4 shadow-lg">
            <div class="text-center mb-4">
              <i class="bi bi-person-circle display-4 text-primary"></i>
              <h3 class="fw-bold mt-2">Entrar</h3>
            </div>
            <div id="loginErro" class="alert alert-danger d-none" role="alert"></div>
            <form id="formLogin">
              <div class="mb-3">
                <label class="form-label">Login</label>
                <input type="text" id="login" class="form-control bg-dark text-white border-secondary" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" id="senha" class="form-control bg-dark text-white border-secondary" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
              </button>
            </form>
            <p class="text-center text-muted mt-3 mb-0">
              Não tem conta? <a href="cadastro.html" class="text-primary">Cadastre-se</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById("formLogin").addEventListener("submit", async function (e) {
      e.preventDefault();
      const login = document.getElementById("login").value.trim();
      const senha = document.getElementById("senha").value;
      const erro = document.getElementById("loginErro");
      erro.classList.add("d-none");
      try {
        const resp = await fetch(`${API_USUARIOS}?login=${encodeURIComponent(login)}`);
        const lista = await resp.json();
        const usuario = lista.find(u => u.senha === senha);
        if (!usuario) {
          erro.textContent = "Login ou senha inválidos.";
          erro.classList.remove("d-none");
          return;
        }
        salvarSessao(usuario);
        window.location.href = "index.html";
      } catch (e) {
        erro.textContent = "Não foi possível conectar ao servidor.";
        erro.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
