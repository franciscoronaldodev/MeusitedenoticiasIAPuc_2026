<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Itens — AI Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-cpu-fill text-primary fs-4"></i>
        <span class="fw-bold">AI <span class="text-primary">Hub</span></span>
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="calendario.html">Calendário</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="pt-navbar pb-5" style="background-color: #090e18; min-height: 100vh;">
    <div class="container">
      <h2 class="section-title text-white mb-4">
        <i class="bi bi-plus-square text-primary me-2"></i>Cadastro de Itens
      </h2>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card bg-dark-card border-primary text-white p-4 shadow-lg">
            <h5 class="fw-bold mb-3" id="formTitulo">Nova ferramenta</h5>
            <form id="formItem">
              <input type="hidden" id="itemId" />
              <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" id="nome" class="form-control bg-dark text-white border-secondary" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea id="descricao" rows="2" class="form-control bg-dark text-white border-secondary" required></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Conteúdo</label>
                <textarea id="conteudo" rows="3" class="form-control bg-dark text-white border-secondary"></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Empresa</label>
                <input type="text" id="empresa" class="form-control bg-dark text-white border-secondary" />
              </div>
              <div class="mb-3">
                <label class="form-label">Categoria</label>
                <input type="text" id="categoria" class="form-control bg-dark text-white border-secondary" />
              </div>
              <div class="mb-3">
                <label class="form-label">Lançamento</label>
                <input type="date" id="lancamento" class="form-control bg-dark text-white border-secondary" />
              </div>
              <div class="mb-3">
                <label class="form-label">Imagem (URL)</label>
                <input type="text" id="imagem_principal" class="form-control bg-dark text-white border-secondary" />
              </div>
              <div class="form-check mb-3">
                <input type="checkbox" id="destaque" class="form-check-input" />
                <label class="form-check-label" for="destaque">Em destaque</label>
              </div>
              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-check-circle me-1"></i>Salvar
              </button>
              <button type="button" id="btnCancelar" class="btn btn-outline-secondary w-100 mt-2 d-none">Cancelar edição</button>
            </form>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Categoria</th>
                  <th>Lançamento</th>
                  <th class="text-end">Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaItens"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/scripts/auth.js"></script>
  <script src="assets/scripts/app.js"></script>
  <script>
    const usuario = usuarioLogado();
    if (!usuario || !usuario.admin) {
      window.location.href = "index.html";
    }

    const form = document.getElementById("formItem");
    const tabela = document.getElementById("tabelaItens");
    const btnCancelar = document.getElementById("btnCancelar");
    let recursosAtuais = [];

    async function listar() {
      const ferramentas = await carregarFerramentas();
      tabela.innerHTML = "";
      ferramentas.forEach(f => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${f.nome}</td>
          <td>${f.categoria || ""}</td>
          <td>${f.lancamento || ""}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-1" data-editar="${f.id}"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" data-excluir="${f.id}"><i class="bi bi-trash"></i></button>
          </td>
        `;
        tabela.appendChild(tr);
      });
      ligarAcoes();
    }

    function limparForm() {
      form.reset();
      document.getElementById("itemId").value = "";
      document.getElementById("formTitulo").textContent = "Nova ferramenta";
      btnCancelar.classList.add("d-none");
      recursosAtuais = [];
    }

    function ligarAcoes() {
      document.querySelectorAll("[data-editar]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const resp = await fetch(`${API_FERRAMENTAS}/${btn.dataset.editar}`);
          const f = await resp.json();
          document.getElementById("itemId").value = f.id;
          document.getElementById("nome").value = f.nome || "";
          document.getElementById("descricao").value = f.descricao || "";
          document.getElementById("conteudo").value = f.conteudo || "";
          document.getElementById("empresa").value = f.empresa || "";
          document.getElementById("categoria").value = f.categoria || "";
          document.getElementById("lancamento").value = f.lancamento || "";
          document.getElementById("imagem_principal").value = f.imagem_principal || "";
          document.getElementById("destaque").checked = !!f.destaque;
          recursosAtuais = f.recursos || [];
          document.getElementById("formTitulo").textContent = "Editar ferramenta";
          btnCancelar.classList.remove("d-none");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
      document.querySelectorAll("[data-excluir]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Deseja excluir esta ferramenta?")) return;
          await fetch(`${API_FERRAMENTAS}/${btn.dataset.excluir}`, { method: "DELETE" });
          listar();
        });
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("itemId").value;
      const item = {
        nome: document.getElementById("nome").value.trim(),
        descricao: document.getElementById("descricao").value.trim(),
        conteudo: document.getElementById("conteudo").value.trim(),
        empresa: document.getElementById("empresa").value.trim(),
        categoria: document.getElementById("categoria").value.trim(),
        lancamento: document.getElementById("lancamento").value,
        imagem_principal: document.getElementById("imagem_principal").value.trim(),
        destaque: document.getElementById("destaque").checked,
        recursos: recursosAtuais
      };
      if (id) {
        await fetch(`${API_FERRAMENTAS}/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(item)
        });
      } else {
        await fetch(API_FERRAMENTAS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(item)
        });
      }
      limparForm();
      listar();
    });

    btnCancelar.addEventListener("click", limparForm);

    listar();
  </script>
</body>
</html>
