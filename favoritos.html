<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favoritos — AI Hub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-cpu-fill text-primary fs-4"></i>
        <span class="fw-bold">AI <span class="text-primary">Hub</span></span>
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="calendario.html">Calendário</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="pt-navbar pb-5" style="background-color: #090e18; min-height: 100vh;">
    <div class="container">
      <h2 class="section-title text-white mb-4">
        <i class="bi bi-heart-fill text-danger me-2"></i>Meus Favoritos
      </h2>
      <div id="avisoFavoritos" class="alert alert-secondary d-none" role="alert"></div>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="cardsContainer"></div>
    </div>
  </section>

  <footer class="footer bg-black text-center text-muted py-3">
    <div class="container">
      <small>
        &copy; 2026 <strong class="text-white">AI Hub</strong> — Trabalho Prático 2
        &nbsp;|&nbsp; Desenvolvido por Francisco Ronaldo Vasconcelos Araújo
      </small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const aviso = document.getElementById("avisoFavoritos");
      const usuario = usuarioLogado();
      if (!usuario) {
        window.location.href = "login.html";
        return;
      }
      const atualizado = await atualizarSessao();
      const favoritos = (atualizado && atualizado.favoritos) || [];
      const todas = await carregarFerramentas();
      listaFerramentas = todas.filter(f => favoritos.includes(f.id));
      if (listaFerramentas.length === 0) {
        aviso.textContent = "Você ainda não favoritou nenhuma ferramenta.";
        aviso.classList.remove("d-none");
      }
      renderCards(listaFerramentas);
    });
  </script>
</body>
</html>
